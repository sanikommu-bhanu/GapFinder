<!doctype html>
<html><head><meta charset="utf-8"><title>GapFinder responsive harness</title>
<style>
  body{margin:0;background:#2a2a35;font:12px system-ui;color:#fff;padding:16px}
  .row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  figure{margin:0}
  figcaption{padding:6px 0;opacity:.75}
  iframe{border:0;background:#fff;border-radius:8px;display:block}
</style></head>
<body>
<div class="row" id="row"></div>
<script>
  const sizes = [[320,568],[375,812],[390,844],[414,896]];
  const route = new URLSearchParams(location.search).get('route') || '/splash';
  document.getElementById('row').innerHTML = sizes.map(([w,h])=>
    `<figure><figcaption>${w}×${h}</figcaption><iframe src="${route}" width="${w}" height="${h}"></iframe></figure>`
  ).join('');
</script>
</body></html>
